[project]
name = "justsigns-mocap-compression"
version = "0.1.0"
description = "A motion capture data compression based on curves fitting for JustSigns project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ijson>=3.5.0",
    "ipykernel>=7.2.0",
    "ipympl>=0.10.0",
    "jupyterlab>=4.5.8",
    "matplotlib>=3.10.9",
    "nbformat>=5.10.4",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "pygltflib>=1.16.5",
    "scipy>=1.17.1",
    "trimesh>=4.12.2",
]
