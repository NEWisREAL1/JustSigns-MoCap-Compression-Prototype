<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoCap Multi-Clip Visualizer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; color: white; font-family: sans-serif; }
        #ui-panel { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; border: 1px solid #444; z-index: 100; }
        #ui-panel h3 { margin: 0 0 10px 0; font-size: 16px; color: #00aaff; }
        .toggle-row { margin-bottom: 8px; display: flex; align-items: center; }
        #loading { position: absolute; top: 50%; width: 100%; text-align: center; font-size: 24px; pointer-events: none; }
        #error-log { position: absolute; bottom: 15px; left: 15px; color: #ff5555; font-size: 14px; }
    </style>
</head>
<body>
    <div id="ui-panel">
        <h3>View Options</h3>
        <div class="toggle-row"><input type="checkbox" id="toggle-meshes" checked><label>Show Meshes</label></div>
        <div class="toggle-row"><input type="checkbox" id="toggle-skeletons" checked><label>Show Skeletons</label></div>
    </div>
    <div id="loading">Loading assets...</div>
    <div id="error-log"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

        const CONFIG = {
            modelUrl: '../model/Alex_Rig_v2.4_rokoko_wface_nov30.glb',
            spacingX: 1.5, spacingZ: 2.0,
            clips: [
                { name: 'Original', url: '../data/json/clip_73.json' },
                { name: 'Raw Base64', url: '../out/raw_b64/raw_b64_clip_73.json' },
                { name: 'Quantized B64', url: '../out/quantize/quantize_clip_73.json' }
            ]
        };

        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x1a1a1a, 10, 100);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);
        scene.add(new THREE.GridHelper(50, 50, 0x888888, 0x333333));

        const meshGroup = new THREE.Group();
        const skeletonGroup = new THREE.Group();
        scene.add(meshGroup); scene.add(skeletonGroup);

        const clock = new THREE.Clock();
        const mixers = [];

        async function init() {
            try {
                const gltf = await new Promise((res, rej) => new GLTFLoader().load(CONFIG.modelUrl, res, undefined, rej));
                
                const loadedClips = await Promise.all(
                    CONFIG.clips.map(async (info) => {
                        try {
                            const res = await fetch(info.url);
                            if (!res.ok) throw new Error(res.status);
                            return { name: info.name, data: await res.json() };
                        } catch(e) { 
                            document.getElementById('error-log').innerHTML += `Failed: ${info.url}<br/>`; 
                            return null; 
                        }
                    })
                );

                const activeClips = loadedClips.filter(c => c !== null);
                document.getElementById('loading').style.display = 'none';

                activeClips.forEach((clipObj, index) => {
                    const xPos = (index - (activeClips.length - 1) / 2) * CONFIG.spacingX;
                    const threeClip = compileAnimationClip(clipObj.data);

                    const meshClone = SkeletonUtils.clone(gltf.scene);
                    meshClone.position.set(xPos, 0, 0);
                    meshGroup.add(meshClone);
                    attachAnimation(meshClone, threeClip);

                    const skelClone = SkeletonUtils.clone(gltf.scene);
                    skelClone.traverse(c => { if (c.isMesh) c.visible = false; });
                    const helper = new THREE.SkeletonHelper(skelClone);
                    helper.material.linewidth = 3; skelClone.add(helper);
                    skelClone.position.set(xPos / 2, 0, -CONFIG.spacingZ);
                    skeletonGroup.add(skelClone);
                    attachAnimation(skelClone, threeClip);

                    const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.roundRect(0,0,512,128,20); ctx.fill();
                    ctx.font = 'bold 36px sans-serif'; ctx.fillStyle = '#00aaff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(clipObj.name, 256, 64);
                    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas) }));
                    sprite.position.set(xPos, 2.3, 0); sprite.scale.set(1.5, 0.375, 1);
                    scene.add(sprite);
                });

                camera.position.set(0, 2, activeClips.length * 1.5 + 4);
                controls.update();
                animate();
            } catch (e) { console.error(e); }
        }

        // ==========================================
        //  MODULAR CODEC DECODER
        // ==========================================
        
        function decodeBase64ToArray(b64String, ArrayType) {
            const binaryString = atob(b64String);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return new ArrayType(bytes.buffer);
        }

        function buildTrack(baseType, name, times, values) {
            if (baseType === 'quaternion') return new THREE.QuaternionKeyframeTrack(name, times, values);
            if (baseType === 'number') return new THREE.NumberKeyframeTrack(name, times, values);
            if (baseType === 'vector') return new THREE.VectorKeyframeTrack(name, times, values);
            return null;
        }

        function dequantizeTrack(trackDef, DataType) {
            // Unpack B64 to integers
            const codes_times = decodeBase64ToArray(trackDef.times.codes_b64, DataType);
            const codes_values = decodeBase64ToArray(trackDef.values.codes_b64, DataType);

            const m = codes_times.length;
            const dim = codes_values.length / m;

            const times = new Float32Array(m);
            const values = new Float32Array(m * dim);

            // Safely parse scale and zero arrays
            const ts = Array.isArray(trackDef.times.scale) ? trackDef.times.scale : [trackDef.times.scale];
            const tz = Array.isArray(trackDef.times.zero) ? trackDef.times.zero : [trackDef.times.zero];
            const vs = Array.isArray(trackDef.values.scale) ? trackDef.values.scale : [trackDef.values.scale];
            const vz = Array.isArray(trackDef.values.zero) ? trackDef.values.zero : [trackDef.values.zero];

            // Reconstruct: scale * (code - zero)
            for (let i = 0; i < m; i++) {
                times[i] = ts[0] * (codes_times[i] - tz[0]);
                for (let d = 0; d < dim; d++) {
                    const idx = i * dim + d;
                    values[idx] = (vs.length > 1 ? vs[d] : vs[0]) * (codes_values[idx] - (vz.length > 1 ? vz[d] : vz[0]));
                }
            }
            return { times, values };
        }

        function compileAnimationClip(jsonData) {
            const animData = jsonData.animationClip;
            const tracks = [];

            animData.tracks.forEach(trackDef => {
                const type = trackDef.type;
                let threeTrack = null;

                // 1. Plaintext Arrays (Legacy)
                if (['quaternion', 'number', 'vector'].includes(type)) {
                    threeTrack = buildTrack(type, trackDef.name, new Float32Array(trackDef.times), new Float32Array(trackDef.values));
                    console.log("Compiled Plaintext Track")
                }
                
                // 2. Raw Base64 Format
                else if (type.endsWith('_raw_b64')) {
                    const baseType = type.replace('_raw_b64', '');
                    const times = decodeBase64ToArray(trackDef.times, Float32Array);
                    const values = decodeBase64ToArray(trackDef.values, Float32Array);
                    threeTrack = buildTrack(baseType, trackDef.name, times, values);
                    console.log("Compiled Raw Base64 Track")
                }
                
                // 3. Quantized Base64 Format
                else if (type.endsWith('_b64')) {
                    const baseType = type.replace('_b64', '');
                    // Passing Uint8Array since QUANTIZE_BASE = np.uint8
                    const decoded = dequantizeTrack(trackDef, Uint8Array);
                    
                    // Renormalize Quaternions (Vital to prevent scale skewing from float rounding)
                    if (baseType === 'quaternion') {
                        for (let i = 0; i < decoded.times.length; i++) {
                            const idx = i * 4;
                            let x = decoded.values[idx], y = decoded.values[idx+1], z = decoded.values[idx+2], w = decoded.values[idx+3];
                            let norm = Math.sqrt(x*x + y*y + z*z + w*w) + 1e-8;
                            decoded.values[idx] /= norm; decoded.values[idx+1] /= norm; 
                            decoded.values[idx+2] /= norm; decoded.values[idx+3] /= norm;
                        }
                    }
                    threeTrack = buildTrack(baseType, trackDef.name, decoded.times, decoded.values);
                    console.log("Compiled Quantized Base64 Track")
                }

                if (threeTrack) tracks.push(threeTrack);
            });

            return new THREE.AnimationClip(animData.name, animData.duration, tracks);
        }

        function attachAnimation(model, clip) {
            const mixer = new THREE.AnimationMixer(model);
            mixer.clipAction(clip).play();
            mixers.push(mixer);
        }

        document.getElementById('toggle-meshes').addEventListener('change', e => meshGroup.visible = e.target.checked);
        document.getElementById('toggle-skeletons').addEventListener('change', e => skeletonGroup.visible = e.target.checked);
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            mixers.forEach(mixer => mixer.update(delta));
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
